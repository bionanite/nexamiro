version: '3.8'

services:
  # The UI we just built
  nexamiro-web:
    build: .
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - vector-db

  # Placeholder for the future Node.js / Python API Gateway
  nexamiro-api:
    image: node:20-alpine
    command: echo "API Gateway coming soon..."
    ports:
      - "8080:8080"
    
  # Enterprise Vector Database for your RAG Pipeline
  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

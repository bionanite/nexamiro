services:
  nexamiro:
    build: .
    ports:
      - '127.0.0.1:3000:8080'
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:?Set ACCESS_TOKEN to a random value of at least 24 characters}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_GENERAL: ${MODEL_GENERAL:-}
      MODEL_REASONING: ${MODEL_REASONING:-}
      MODEL_CODING: ${MODEL_CODING:-}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-60000}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1800}
      MODEL_REASONING_ENABLED: ${MODEL_REASONING_ENABLED:-}
      MODEL_PROVIDER_NAME: ${MODEL_PROVIDER_NAME:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - nexamiro_data:/app/data
    restart: unless-stopped

volumes:
  nexamiro_data:
